name: Azure Static Web Apps CI/CD

# Aligned with NASA (orange-hill) / CHAOS (salmon-forest) / ARTEMIS (calm-desert).
# Reference only — those repos were not modified.

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy
        id: builddeploy
        continue-on-error: true
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_RIVER_0DE1AED0F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: "api"
          output_location: "/"
          skip_app_build: true
          skip_api_build: false
        env:
          NODE_VERSION: "20"

      - name: Deploy via SWA CLI fallback
        id: clifallback
        if: steps.builddeploy.outcome != 'success'
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_RIVER_0DE1AED0F }}
        run: |
          set -euo pipefail
          echo "Primary action failed — trying SWA CLI. Token length: ${#SWA_CLI_DEPLOYMENT_TOKEN}"
          if [ "${#SWA_CLI_DEPLOYMENT_TOKEN}" -lt 20 ]; then
            echo "::error::Deployment token secret is empty or too short. Reset it from Azure Portal → Static Web App → Manage deployment token."
            exit 1
          fi
          cd api
          npm install --omit=dev
          cd ..
          set +e
          npx -y @azure/static-web-apps-cli@2.0.2 deploy . \
            --deployment-token "$SWA_CLI_DEPLOYMENT_TOKEN" \
            --app-location "/" \
            --api-location "api" \
            --output-location "/" \
            --api-language node \
            --api-version "20" \
            --env production \
            --verbose 2>&1 | tee /tmp/swa-deploy.log
          cli_rc=${PIPESTATUS[0]}
          set -e
          if grep -qiE 'api key was invalid|No matching Static Web App|BadRequest|Deployment Failed' /tmp/swa-deploy.log; then
            echo "::error::SWA CLI reported a deploy rejection (see log above)."
            exit 1
          fi
          if [ "$cli_rc" -ne 0 ]; then
            echo "::error::SWA CLI exited with code $cli_rc"
            exit 1
          fi
          echo "SWA CLI deploy finished without rejection errors."

      - name: Fail if neither deploy path succeeded
        if: always() && steps.builddeploy.outcome != 'success' && steps.clifallback.outcome != 'success'
        run: |
          echo "::error::Deploy failed. Primary Azure/static-web-apps-deploy and SWA CLI both failed."
          echo "Almost always this means the GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_RIVER_0DE1AED0F does not match the token for SWA white-river-0de1aed0f (bd-budgets)."
          echo "Fix: Azure Portal → bd-budgets → Manage deployment token → copy → GitHub repo Settings → Secrets → update that secret → re-run this workflow."
          exit 1

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullquest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_RIVER_0DE1AED0F }}
          app_location: "/"
          action: "close"
