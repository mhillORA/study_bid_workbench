name: CT.gov ophthalmology sync (app ping)

# Mon–Fri ~9:00 America/New_York (EDT = UTC−4 → 13:00 UTC).
# During EST (UTC−5) this fires at 8:00 local — accept seasonal shift or adjust cron.
# Calls the Static Web App API (uses App Settings Cosmos). No COSMOS_* in Actions.
# Auth: COPILOT_ASK_KEY secret → x-copilot-key header (same key as SWA App Setting).
# If the secret is missing, scheduled runs soft-skip (warning, exit 0); manual dispatch still fails.
# /api/ctgov/sync allows anonymous at SWA edge; the Function still requires key or signed-in user.

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Request full backfill (API rejects large full; use local Python --full)"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    name: POST /api/ctgov/sync
    timeout-minutes: 30
    steps:
      - name: Trigger CT.gov delta via app API
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          CTGOV_SYNC_URL: ${{ secrets.CTGOV_SYNC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_ASK_KEY:-}" ]; then
            echo "::warning::Missing Actions secret COPILOT_ASK_KEY (same value as SWA App Setting COPILOT_ASK_KEY)."
            echo "Daily ping skipped. Sync from the signed-in app UI, or set the secret when Azure Portal is reachable (VPN / allowlisted IP)."
            # Soft-skip so the schedule is not a daily red failure while Azure is IP-locked.
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit 1
            fi
            exit 0
          fi
          URL="${CTGOV_SYNC_URL:-https://white-river-0de1aed0f.7.azurestaticapps.net/api/ctgov/sync}"
          FULL="${{ github.event_name == 'workflow_dispatch' && inputs.full || false }}"
          BODY='{"full":false}'
          if [ "$FULL" = "true" ]; then BODY='{"full":true}'; fi
          echo "POST $URL"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-copilot-key: $COPILOT_ASK_KEY" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "$BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "HTTP $CODE"
            exit 1
          fi
