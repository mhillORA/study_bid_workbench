name: Intelligence daily sync (CT.gov + Veeva + Salesforce)

# BOTH modes (do not remove either):
#   1) schedule  — daily DELTA only (full=false) at 12:00 AM Eastern (EDT).
#                  cron 0 4 * * * UTC = midnight EDT / 11:00 PM EST.
#                  (GitHub Actions is UTC-only; no DST auto-adjust.)
#   2) manual    — workflow_dispatch and/or Data Status UI for delta OR full backfill.
#
# Hits Function App ora-buddy-api (VEEVA_*/SF_*/Cosmos live there).
# Auth: COPILOT_ASK_KEY secret → x-copilot-key (same value as FA/SWA App Setting).
# If the secret is missing, scheduled runs soft-skip (warning, exit 0); manual dispatch fails.
#
# Browser "Ingest Veeva" is for operators when GH Actions isn't handy; prefer Actions
# for full pulls so CORS/VPN/45s SWA limits don't kill the run.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      ctgov_full:
        description: "CT.gov FULL backfill (manual only; schedule always delta)"
        type: boolean
        default: false
      veeva_full:
        description: "Veeva FULL pull (manual only; schedule always delta)"
        type: boolean
        default: false
      skip_ctgov:
        description: "Skip ClinicalTrials.gov"
        type: boolean
        default: false
      skip_veeva:
        description: "Skip Veeva"
        type: boolean
        default: false
      skip_salesforce:
        description: "Skip Salesforce tables + crosswalk"
        type: boolean
        default: false

env:
  DEFAULT_API_BASE: https://ora-buddy-api-hrdbgqh9cvaub5ft.eastus2-01.azurewebsites.net

jobs:
  sync:
    runs-on: ubuntu-latest
    name: POST CT.gov / Veeva / Salesforce deltas
    timeout-minutes: 150
    steps:
      - name: Resolve API base + auth
        id: prep
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          ORA_BUDDY_API_URL: ${{ secrets.ORA_BUDDY_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${COPILOT_ASK_KEY:-}" ]; then
            echo "::warning::Missing Actions secret COPILOT_ASK_KEY (same value as ora-buddy-api App Setting COPILOT_ASK_KEY)."
            echo "Daily sync skipped. Sync from the signed-in app UI, or set the secret."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              exit 1
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${ORA_BUDDY_API_URL:-$DEFAULT_API_BASE}"
          BASE="${BASE%/}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "API base: $BASE"

      - name: ClinicalTrials.gov delta
        if: steps.prep.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_ctgov != true)
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          API_BASE: ${{ steps.prep.outputs.base }}
        run: |
          set -euo pipefail
          FULL="${{ github.event_name == 'workflow_dispatch' && inputs.ctgov_full || false }}"
          BODY='{"full":false}'
          if [ "$FULL" = "true" ]; then BODY='{"full":true}'; fi
          URL="$API_BASE/api/ctgov/sync"
          echo "POST $URL $BODY"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-copilot-key: $COPILOT_ASK_KEY" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "$BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "HTTP $CODE"
            exit 1
          fi

      - name: Veeva delta
        if: steps.prep.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_veeva != true)
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          API_BASE: ${{ steps.prep.outputs.base }}
        run: |
          set -euo pipefail
          FULL="${{ github.event_name == 'workflow_dispatch' && inputs.veeva_full || false }}"
          # Kick async so Azure's ~230s HTTP gateway can't kill a long Vault pull.
          # Background worker runs under functionTimeout (60m); we poll progress.
          if [ "$FULL" = "true" ]; then
            BODY='{"full":true,"async":true,"prioritizeEmpty":true}'
          else
            BODY='{"async":true,"prioritizeEmpty":true}'
          fi
          URL="$API_BASE/api/veeva/sync"
          echo "POST $URL $BODY"
          RESP=$(curl -sS -w "\n%{http_code}" --max-time 120 -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-copilot-key: $COPILOT_ASK_KEY" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "$BODY_OUT"
          if [ "$CODE" != "202" ] && [ "$CODE" != "200" ]; then
            echo "HTTP $CODE"
            exit 1
          fi

          echo "Polling Veeva sync progress (up to ~90 minutes)…"
          DEADLINE=$((SECONDS + 5400))
          LAST=""
          while [ "$SECONDS" -lt "$DEADLINE" ]; do
            sleep 30
            STATUS_JSON=$(curl -sS --max-time 60 "$API_BASE/api/veeva/sync" \
              -H "Accept: application/json" \
              -H "x-copilot-key: $COPILOT_ASK_KEY" || true)
            PARSE=$(STATUS_JSON="$STATUS_JSON" python3 - <<'PY'
import json, os
raw = os.environ.get("STATUS_JSON") or ""
try:
    d = json.loads(raw or "{}")
except Exception:
    print("parse_error||||")
    raise SystemExit(0)
sync = d.get("sync") or {}
prog = sync.get("progress") if isinstance(sync, dict) else None
if not isinstance(prog, dict):
    prog = d.get("progress") if isinstance(d.get("progress"), dict) else {}
status = str(prog.get("status") or "").lower()
msg = str(prog.get("message") or prog.get("currentObject") or prog.get("currentContainer") or "")[:160]
done = prog.get("objectsDone")
total = prog.get("objectsTotal")
print(f"{status}|{done}|{total}|{msg}")
PY
)
            IFS='|' read -r ST DONE TOTAL MSG <<< "$PARSE"
            LINE="status=${ST:-?} done=${DONE:-?} total=${TOTAL:-?} ${MSG}"
            if [ "$LINE" != "$LAST" ]; then
              echo "$LINE"
              LAST="$LINE"
            fi
            case "$ST" in
              complete|completed|success)
                echo "Veeva sync complete."
                exit 0
                ;;
              failed|error)
                echo "Veeva sync failed: $MSG"
                exit 1
                ;;
              incomplete)
                echo "Veeva sync incomplete (will resume next run): $MSG"
                exit 0
                ;;
              queued|running|"")
                ;;
              *)
                ;;
            esac
          done
          echo "Timed out waiting for Veeva sync progress"
          exit 1

      - name: Salesforce tables + crosswalk
        if: steps.prep.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_salesforce != true)
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          API_BASE: ${{ steps.prep.outputs.base }}
        run: |
          set -euo pipefail
          # Tables sync upserts Account / Opportunity / Activity_Request__c, then crosswalk.
          BODY='{"tables":true,"thenCrosswalk":true}'
          URL="$API_BASE/api/salesforce/sync"
          echo "POST $URL $BODY"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-copilot-key: $COPILOT_ASK_KEY" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "$BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "HTTP $CODE"
            exit 1
          fi

      - name: Rebuild Dashboard weekly brief
        if: steps.prep.outputs.skip != 'true'
        env:
          COPILOT_ASK_KEY: ${{ secrets.COPILOT_ASK_KEY }}
          API_BASE: ${{ steps.prep.outputs.base }}
        run: |
          set -euo pipefail
          # After SF/Veeva/CT.gov deltas — cache chase/watch/concentration for morning Dashboard.
          BODY='{"refresh":true}'
          URL="$API_BASE/api/dashboard/brief"
          echo "POST $URL $BODY"
          RESP=$(curl -sS -w "\n%{http_code}" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -H "x-copilot-key: $COPILOT_ASK_KEY" \
            -d "$BODY")
          CODE=$(echo "$RESP" | tail -n1)
          BODY_OUT=$(echo "$RESP" | sed '$d')
          echo "$BODY_OUT"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            echo "HTTP $CODE"
            exit 1
          fi
