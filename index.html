<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Study Bid Workbench</title>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- deploy-bust: 2026-07-23T09:10:00-04:00 -->
</head>
<body>
  <div id="compareOverlay" class="compare-overlay" hidden aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">SBW</span>
        <div>
          <strong>Study Bid Workbench</strong>
          <small>Working model</small>
        </div>
      </div>

      <label class="field-label" for="userSelect">Acting as</label>
      <select id="userSelect" class="select"></select>

      <nav class="nav" id="sectionNav" aria-label="Study sections"></nav>

      <div class="sidebar-foot">
        <p class="muted auth-user" id="authUser" hidden></p>
        <a class="btn btn-ghost" id="btnSignOut" href="/.auth/logout" hidden>Sign out</a>
        <button type="button" class="btn btn-ghost" id="btnSave">Save</button>
        <button type="button" class="btn btn-primary" id="btnExport">Export JSON</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="studyMeta">O-06087 · Regeneron · V3</p>
          <h1 id="pageTitle">Hub</h1>
          <p class="subtitle" id="pageSubtitle">Department status and hand-offs</p>
        </div>
        <div class="topbar-actions">
          <span class="pill" id="saveStatus">Unsaved</span>
          <button type="button" class="btn btn-secondary" id="btnRequestFill">Request fill</button>
        </div>
      </header>

      <section class="panel" id="viewRoot"></section>
    </main>
  </div>

  <dialog id="requestDialog" class="dialog">
    <form method="dialog" id="requestForm">
      <h2>Request someone to fill out</h2>
      <p class="muted">Creates a live assignment on this study. No email yet — stub only.</p>
      <label class="field-label" for="requestDept">Department</label>
      <select id="requestDept" class="select" required></select>
      <label class="field-label" for="requestUser">Assign to</label>
      <select id="requestUser" class="select" required></select>
      <label class="field-label" for="requestNote">Note</label>
      <textarea id="requestNote" class="textarea" rows="3" placeholder="What should they complete?"></textarea>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-ghost" value="cancel">Cancel</button>
        <button type="submit" class="btn btn-primary" value="confirm">Send request</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/formulas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
